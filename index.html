      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;

      align-items: center;

      overflow: hidden;
    }

    #container {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    #info {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 100;
    }

    #info h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;

      letter-spacing: 4px;
    }

    #info p {
      font-size: 1rem;
      opacity: 0.7;
    }

    #vr-button {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;

      cursor: pointer;
      z-index: 100;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);

    }

      background: #444;

      box-shadow: none;
    }

      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);

      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
    }

    canvas {
      display: block;
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      opacity: 0.5;
      text-align: center;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 50;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #00ff88;
    }

    #crosshair::before {
      width: 2px;
      height: 20px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #crosshair::after {
      width: 20px;
      height: 2px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    #crosshair-dot {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #00ff88;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
